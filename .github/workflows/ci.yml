# CI cho repo public: GitHub Actions (miễn phí cho repo public). Hai job chạy song song:
# - check: đúng lệnh kiểm trước khi commit, `bash tools/check.sh`: mã chung đã đồng bộ, rồi
#   `claude plugin validate` và `claude plugin test` cho từng mod. Bước tsc của check.sh tự bỏ qua
#   trên CI, vì tệp kiểu của engine chỉ có trên máy đã nạp skill plugin-authoring.
# - check-mod: giao diện của hai mod, bằng `design-kit check-mod --strict` (repo ngoviet/design-kit).
# Phiên bản Claude Code ghim theo bản đang cài trên PC1; nâng ở PC1 thì nâng cả ở đây.
# `claude plugin validate/test` chạy mod ngay trên máy, không gọi model: không cần đăng nhập hay khoá API.
name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CLAUDE_CODE_VERSION: 2.1.311
  DISABLE_AUTOUPDATER: "1"
  CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install -g --no-fund --no-audit "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}"
      - run: claude --version
      - run: bash tools/check.sh

  # check-mod vẽ lại mọi lần mount trong test của mod (cộng một lần mount chung mỗi component), trên terminal và
  # desktop ở 40–200 cột, mỗi ngôn ngữ của tuỳ chọn `language`; đo tràn dòng, chữ bị cắt, tương phản trên nền tối
  # và sáng, cỡ chữ (cả chữ SVG), giảm chuyển động, luật engine. Lỗi cứng làm job đỏ; lỗi mềm chỉ in ra.
  # Container Playwright có Chromium cho phần desktop, cùng tag với CI của design-kit.
  # design-kit ghim theo commit (chưa lên npm): check-mod đổi thì nâng DESIGN_KIT_REF.
  # Ảnh chụp (terminal tối/sáng, desktop) ở artifact `check-mod-shots`, kể cả khi job đỏ.
  check-mod:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.65.1-noble
    env:
      DESIGN_KIT_REF: 709cafaa3a463682a9f5322eef1b8c1c60a65f1e
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: ngoviet/design-kit
          ref: ${{ env.DESIGN_KIT_REF }}
          path: .ci/design-kit
      # `npm ci` của design-kit chạy luôn script prepare (tsup) ⇒ có dist/bin/design-kit.js.
      - name: install
        run: |
          npm install -g --no-audit --no-fund "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}"
          claude --version
          cd .ci/design-kit && npm ci --no-audit --no-fund
      - name: check-mod
        run: |
          fail=0
          for mod in session-band agents-panel; do
            echo "== $mod"
            node .ci/design-kit/dist/bin/design-kit.js check-mod "plugins/$mod" --strict || fail=1
          done
          exit $fail
      - name: screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: check-mod-shots
          path: .design-kit/shots/
          if-no-files-found: ignore
          retention-days: 14
